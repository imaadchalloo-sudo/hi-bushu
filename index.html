<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💖</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
 
.container {
  text-align: center;
  color: white;
}
 
button {
  padding: 15px 35px;
  font-size: 18px;
  border: none;
  border-radius: 50px;
  background: white;
  color: #ff4d6d;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(255,255,255,0.6);
  transition: 0.3s;
}
 
button:hover {
  transform: scale(1.1);
}
 
#message {
  margin-top: 25px;
  font-size: 22px;
  max-width: 320px;
  line-height: 1.6;
}
 
.heart {
  position: absolute;
  animation: float 6s linear infinite;
}
 
@keyframes float {
  0% {transform: translateY(0);}
  100% {transform: translateY(-100vh);}
}
</style>
</head>
 
<body>
 
<div class="container">
  <h2>Tap this 💌</h2>
  <button onclick="start()">Open</button>
  <div id="message"></div>
</div>
 
<script>
let text = "WRITE YOUR MESSAGE HERE 💖";
let i = 0;
 
function start() {
  typeWriter();
  createHearts();
}
 
function typeWriter() {
  if (i < text.length) {
    document.getElementById("message").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 40);
  }
}
 
function createHearts() {
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    document.body.appendChild(heart);
 
    setTimeout(() => heart.remove(), 6000);
  }, 300);
}
</script>
 
</body>
</html>
